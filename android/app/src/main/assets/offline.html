<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#101923">
    <title>SGC sem conexão</title>
    <style>
        *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;padding:24px;background:#101923;color:#fff;font-family:system-ui,sans-serif}.card{width:min(100%,360px);padding:28px 22px;border:1px solid #ffffff24;border-radius:20px;background:#17232e;text-align:center;box-shadow:0 24px 70px #0006}.icon{display:grid;width:64px;height:64px;place-items:center;margin:0 auto 16px;border-radius:18px;background:#ffffff12;font-size:30px}h1{margin:0;font-size:20px}p{margin:10px 0 0;color:#ffffffb8;font-size:14px;line-height:1.5}button{min-height:44px;margin-top:20px;padding:10px 18px;border:0;border-radius:11px;background:#168a4d;color:#fff;font:inherit;font-weight:750}
    </style>
</head>
<body>
    <main class="card">
        <div class="icon" aria-hidden="true">⌁</div>
        <h1>Sem conexão com a internet</h1>
        <p>O SGC funciona somente online. Reconecte-se para acessar seus dados.</p>
        <button type="button" onclick="retry()">Tentar novamente</button>
    </main>
    <script>
        const loginUrl='https://sgc.rzin.com.br/login';
        function retry(){if(navigator.onLine)location.replace(loginUrl)}
        addEventListener('online',retry);
    </script>
</body>
</html>
