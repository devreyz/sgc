<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#173c2e">
    <meta name="color-scheme" content="light">
    <title>SGC sem conexão</title>
    <style>
        * { box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; color-scheme: light; }
        body { min-height: 100dvh; display: grid; place-items: center; padding: 20px; background: #f4f4ef; color: #1d2922; font: 1rem/1.5 system-ui, sans-serif; }
        main { width: min(100%, 380px); padding: 22px; border: 1px solid #d9e0d7; border-radius: 16px; background: #fffefb; }
        h1 { margin: 0; color: #173c2e; font-size: 1.25rem; }
        p { margin: .5rem 0 1rem; color: #516158; }
        a { display: inline-flex; align-items: center; min-height: 44px; padding: .45rem .75rem; margin: .25rem .2rem .25rem 0; border-radius: .65rem; border: 1px solid #d9e0d7; background: #f0f0e9; color: #173c2e; font-weight: 700; text-decoration: none; }
        .primary { background: #d9f172; border-color: #d9f172; }
        a:focus-visible { outline: 2px solid #173c2e; outline-offset: 2px; }
    </style>
</head>
<body>
    <main>
        <h1>Sem conexão com a internet</h1>
        <p>Prestadores podem acessar a agenda de campo que já foi baixada neste aparelho.</p>
        <a class="primary" href="https://sgc.rzin.com.br/__sgc_android_offline/provider-offline.html">Abrir serviços offline</a>
        <a href="https://sgc.rzin.com.br/app">Tentar novamente</a>
    </main>
    <script>
        addEventListener('online', () => location.replace('https://sgc.rzin.com.br/app'));
    </script>
</body>
</html>
